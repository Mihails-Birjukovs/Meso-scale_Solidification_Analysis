name: INM Zensical documentation
on:
  pull_request:
    paths:
      - 'site_docs/**'
      - 'zensical.toml'
      - 'site_publication_manifest.json'
      - 'scripts/validate_docs_site.py'
      - 'scripts/check_zensical_output.py'
      - '.github/workflows/zensical-docs.yml'
  push:
    branches: [main]
    paths:
      - 'site_docs/**'
      - 'zensical.toml'
      - 'site_publication_manifest.json'
      - 'scripts/validate_docs_site.py'
      - 'scripts/check_zensical_output.py'
      - '.github/workflows/zensical-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inm-zensical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Zensical
        run: python -m pip install zensical==0.1.1
      - name: Public-doc allowlist preflight
        run: python scripts/validate_docs_site.py
      - name: Strict site build
        run: zensical build --clean --strict
      - name: Verify generated site assets
        run: python scripts/check_zensical_output.py
      - uses: actions/upload-artifact@v4
        with:
          name: inm-solidification-site-preview
          path: site/
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inm-solidification-site-preview
          path: site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
